services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-email_crm}
      MYSQL_USER: ${DB_USER:-email_crm}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env privately}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env privately}
      TZ: UTC
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
  mariadb:
    image: mariadb:11.4
    profiles: ["hostinger-compat"]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-email_crm}
      MARIADB_USER: ${DB_USER:-email_crm}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env privately}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env privately}
      TZ: UTC
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql-data:
  mariadb-data:
